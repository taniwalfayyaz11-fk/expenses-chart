<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="balance">
        <div class="price">
          <h1>My balance</h1>
          <h2>$921.48</h2>
        </div>
        <div class="svg">
          <img src="logo.svg" alt="" />
        </div>
      </div>

      <div class="spend">
        <h3>Spending - Last 7 days</h3>
        <div class="all">
          <div class="updown">
            <div class="box"></div>
            <h4>mon</h4>
          </div>

          <div class="updown">
            <div class="box"></div>
            <h4>tue</h4>
          </div>

          <div class="updown">
            <div class="box"></div>
            <h4>wed</h4>
          </div>

          <div class="updown">
            <div class="box"></div>
            <h4>thu</h4>
          </div>

          <div class="updown">
            <div class="box"></div>
            <h4>fri</h4>
          </div>

          <div class="updown">
            <div class="box"></div>
            <h4>sat</h4>
          </div>

          <div class="updown">
            <div class="box"></div>
            <h4>sun</h4>
          </div>
        </div>

        <div class="flc">
          <div class="dollar">
            <span>Total this month</span>
            <h4>$478.33</h4>
          </div>

          <div class="month">
            <h5>+2.4%</h5>
            <h6>from last month</h6>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
